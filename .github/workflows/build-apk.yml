name: Build Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.9'

    - name: Build Debug APK
      run: |
        gradle assembleDebug --stacktrace > build_log.txt 2>&1 || BUILD_STATUS=$?
        cat build_log.txt
        if [ "${BUILD_STATUS:-0}" -ne 0 ]; then
          echo "### ❌ Build Failed - Error Summary" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          grep -E "e: |error:|Compilation error|FAILED|FAILURE:" build_log.txt | head -n 50 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          exit $BUILD_STATUS
        fi

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: FTP-Manager-APK
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30
